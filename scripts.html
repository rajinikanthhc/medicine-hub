<script>

/* =====================================================
   GLOBAL DATA
===================================================== */

let medicines = [];
let categories = [];

let selectedCategory = "ALL";
let searchText = "";
let favoritesOnly = false;

let editingOriginalName = "";
let medicineBeingDeleted = "";

let currentSort = "az";


/* =====================================================
   CATEGORY ICONS
===================================================== */

const defaultCategoryIcons = {

  "cough": "😷",
  "fever": "🌡️",
  "cold": "🤧",
  "cough & cold": "😷",
  "pain": "💊",
  "headache": "🤕",
  "stomach": "🩺",
  "allergy": "🤧",
  "skin": "🧴",
  "eye": "👁️",
  "ear": "👂",
  "vitamins": "💊",
  "diabetes": "🩸",
  "blood pressure": "❤️",
  "heart": "❤️",
  "infection": "🦠",
  "children": "👶",
  "other": "💊"

};


/* =====================================================
   FAVORITE CHECK
   Handles TRUE, true, Yes, 1, etc.
===================================================== */

function isFavorite(medicine) {

  const value = medicine.favorite;

  if (value === true) {
    return true;
  }

  if (typeof value === "string") {

    const text =
      value.trim().toLowerCase();

    return (
      text === "true" ||
      text === "yes" ||
      text === "1" ||
      text === "⭐"
    );

  }

  if (value === 1) {
    return true;
  }

  return false;

}


/* =====================================================
   CATEGORY ICON
===================================================== */

function getCategoryIcon(category) {

  const found =
    categories.find(function(item) {

      return (
        String(item.name || "")
          .trim()
          .toLowerCase() ===
        String(category || "")
          .trim()
          .toLowerCase()
      );

    });


  if (
    found &&
    found.icon
  ) {

    return found.icon;

  }


  const key =
    String(category || "")
      .trim()
      .toLowerCase();


  return (
    defaultCategoryIcons[key] ||
    "💊"
  );

}


/* =====================================================
   PAGE LOAD
===================================================== */

window.onload = function() {

  loadEverything();

};


function loadEverything() {

  /* LOAD MEDICINES */

  google.script.run

    .withSuccessHandler(function(data) {

      medicines =
        data || [];

      updateFavoriteCount();

      renderCategories();

      renderMedicines();

    })

    .withFailureHandler(showError)

    .getMedicines();


  /* LOAD CATEGORIES */

  google.script.run

    .withSuccessHandler(function(data) {

      categories =
        data || [];

      renderCategories();

      populateCategorySelect();

      renderSettingsCategories();

      renderMedicines();

    })

    .withFailureHandler(showError)

    .getCategories();

}


/* =====================================================
   CATEGORY CARDS
===================================================== */

function renderCategories() {

  const container =
    document.getElementById(
      "categoryScroller"
    );


  if (!container) {
    return;
  }


  container.innerHTML = "";


  /* ALL MEDICINES */

  container.appendChild(

    createCategoryCard(
      "ALL",
      "💊",
      medicines.length,
      0
    )

  );


  /* CATEGORIES */

  categories.forEach(
    function(category, index) {

      const count =
        medicines.filter(
          function(medicine) {

            return (
              String(
                medicine.category || ""
              )
                .trim()
                .toLowerCase() ===
              String(
                category.name || ""
              )
                .trim()
                .toLowerCase()
            );

          }
        ).length;


      container.appendChild(

        createCategoryCard(

          category.name,

          category.icon ||
            getCategoryIcon(
              category.name
            ),

          count,

          index + 1

        )

      );

    }
  );

}


/* =====================================================
   CREATE CATEGORY CARD
===================================================== */

function createCategoryCard(
  category,
  icon,
  count,
  index
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "category-card category-color-" +
    (index % 8);


  if (
    selectedCategory ===
    category
  ) {

    card.classList.add(
      "active"
    );

  }


  card.onclick =
    function() {

      selectCategory(
        category
      );

    };


  card.innerHTML =

    '<div class="category-icon">' +

      escapeHtml(icon) +

    '</div>' +

    '<div class="category-name">' +

      escapeHtml(

        category === "ALL"
          ? "All Medicines"
          : category

      ) +

    '</div>' +

    '<div class="category-count">' +

      count +

      (
        count === 1
          ? " medicine"
          : " medicines"
      ) +

    '</div>';


  return card;

}


/* =====================================================
   SELECT CATEGORY
===================================================== */

function selectCategory(category) {

  selectedCategory =
    category;

  favoritesOnly =
    false;

  renderCategories();

  renderMedicines();

}


/* =====================================================
   FAVORITES
===================================================== */

function showFavorites() {

  favoritesOnly =
    !favoritesOnly;


  if (favoritesOnly) {

    selectedCategory =
      "ALL";

  }


  renderCategories();

  renderMedicines();

}


/* =====================================================
   FAVORITE COUNT
===================================================== */

function updateFavoriteCount() {

  const count =
    medicines.filter(
      function(medicine) {

        return isFavorite(
          medicine
        );

      }
    ).length;


  const element =
    document.getElementById(
      "favoriteCount"
    );


  if (element) {

    element.textContent =
      count;

  }

}


/* =====================================================
   SEARCH
===================================================== */

function handleSearch() {

  const input =
    document.getElementById(
      "searchInput"
    );


  searchText =
    input
      ? input.value.trim().toLowerCase()
      : "";


  const clearButton =
    document.getElementById(
      "clearSearch"
    );


  if (clearButton) {

    if (searchText) {

      clearButton.classList.remove(
        "hidden"
      );

    }
    else {

      clearButton.classList.add(
        "hidden"
      );

    }

  }


  renderMedicines();

}


function clearSearch() {

  const input =
    document.getElementById(
      "searchInput"
    );


  if (input) {
    input.value = "";
  }


  searchText = "";


  const clearButton =
    document.getElementById(
      "clearSearch"
    );


  if (clearButton) {

    clearButton.classList.add(
      "hidden"
    );

  }


  renderMedicines();

}


/* =====================================================
   SORT
===================================================== */

function changeSort() {

  const select =
    document.getElementById(
      "sortSelect"
    );


  if (select) {

    currentSort =
      select.value;

  }


  renderMedicines();

}


/* =====================================================
   FILTER MEDICINES
===================================================== */

function getFilteredMedicines() {

  let list =
    medicines.slice();


  /* CATEGORY */

  if (
    selectedCategory !==
    "ALL"
  ) {

    list =
      list.filter(
        function(medicine) {

          return (
            String(
              medicine.category || ""
            )
              .trim()
              .toLowerCase() ===
            String(
              selectedCategory
            )
              .trim()
              .toLowerCase()
          );

        }
      );

  }


  /* FAVORITES */

  if (favoritesOnly) {

    list =
      list.filter(
        function(medicine) {

          return isFavorite(
            medicine
          );

        }
      );

  }


  /* SEARCH */

  if (searchText) {

    list =
      list.filter(
        function(medicine) {

          const combined = [

            medicine.name,
            medicine.category,
            medicine.onlineLink,
            medicine.genericName,
            medicine.notes

          ]
            .join(" ")
            .toLowerCase();


          return combined.includes(
            searchText
          );

        }
      );

  }


  /*
   * FAVORITES ALWAYS FIRST
   * THEN A-Z OR Z-A
   */

  list.sort(
    function(a, b) {

      const favoriteA =
        isFavorite(a);

      const favoriteB =
        isFavorite(b);


      if (
        favoriteA !==
        favoriteB
      ) {

        return favoriteA
          ? -1
          : 1;

      }


      const nameA =
        String(
          a.name || ""
        )
          .trim()
          .toLowerCase();


      const nameB =
        String(
          b.name || ""
        )
          .trim()
          .toLowerCase();


      const result =
        nameA.localeCompare(
          nameB
        );


      return currentSort ===
        "za"
        ? -result
        : result;

    }
  );


  return list;

}


/* =====================================================
   RENDER MEDICINES
===================================================== */

function renderMedicines() {

  const tbody =
    document.getElementById(
      "medicineTableBody"
    );


  if (!tbody) {
    return;
  }


  const list =
    getFilteredMedicines();


  updatePanelTitle(
    list
  );


  tbody.innerHTML = "";


  if (
    list.length === 0
  ) {

    const row =
      document.createElement(
        "tr"
      );


    row.innerHTML =

      '<td colspan="7" ' +
      'style="text-align:center;' +
      'padding:35px;color:#718096;">' +

      (
        favoritesOnly
          ? "No favorite medicines yet."
          : "No medicines in this category yet."
      ) +

      '</td>';


    tbody.appendChild(
      row
    );


    return;

  }


  list.forEach(
    function(medicine) {

      tbody.appendChild(
        createMedicineRow(
          medicine
        )
      );

    }
  );

}


/* =====================================================
   PANEL TITLE
===================================================== */

function updatePanelTitle(list) {

  const title =
    document.getElementById(
      "selectedCategoryTitle"
    );


  const count =
    document.getElementById(
      "selectedCategoryCount"
    );


  const icon =
    document.getElementById(
      "selectedCategoryIcon"
    );


  if (!title || !count || !icon) {
    return;
  }


  if (favoritesOnly) {

    title.textContent =
      "Favorites";

    icon.textContent =
      "⭐";

  }
  else if (
    selectedCategory ===
    "ALL"
  ) {

    title.textContent =
      "All Medicines";

    icon.textContent =
      "💊";

  }
  else {

    title.textContent =
      selectedCategory;

    icon.textContent =
      getCategoryIcon(
        selectedCategory
      );

  }


  count.textContent =
    list.length +
    (
      list.length === 1
        ? " medicine"
        : " medicines"
    );

}


/* =====================================================
   CREATE MEDICINE ROW
===================================================== */

function createMedicineRow(medicine) {

  const row =
    document.createElement(
      "tr"
    );


  const link =
    String(
      medicine.onlineLink || ""
    ).trim();


  let linkHtml;


  if (link) {

    linkHtml =

      '<a class="online-link" ' +

      'href="' +
      escapeAttribute(link) +
      '" ' +

      'target="_blank" ' +

      'rel="noopener noreferrer">' +

      'Open Link' +

      '</a>';

  }
  else {

    linkHtml =
      '<span class="no-link">—</span>';

  }


  const favorite =
    isFavorite(
      medicine
    );


  /*
   * IMPORTANT:
   * The entire row HTML is completed
   * before JavaScript continues.
   */

  row.innerHTML =

    '<td class="favorite-column">' +

      '<button ' +

      'class="favorite-star ' +
      (
        favorite
          ? "on"
          : "off"
      ) +

      '" ' +

      'title="' +

      (
        favorite
          ? "Remove favorite"
          : "Add favorite"
      ) +

      '">' +

      (
        favorite
          ? "⭐"
          : "☆"
      ) +

      '</button>' +

    '</td>' +


    '<td>' +

      '<span class="medicine-name">' +

        escapeHtml(
          medicine.name
        ) +

      '</span>' +

    '</td>' +


    '<td>' +

      escapeHtml(
        medicine.category ||
        "—"
      ) +

    '</td>' +


    '<td>' +

      linkHtml +

    '</td>' +


    '<td>' +

      escapeHtml(
        medicine.genericName ||
        "—"
      ) +

    '</td>' +


    '<td class="notes-cell">' +

      escapeHtml(
        medicine.notes ||
        "—"
      ) +

    '</td>' +


    '<td class="edit-column">' +

      '<button ' +

      'class="edit-button" ' +

      'title="Edit">' +

      '✏️' +

      '</button>' +

    '</td>';


  /*
   * FAVORITE
   */

  const favoriteButton =
    row.querySelector(
      ".favorite-star"
    );


  if (favoriteButton) {

    favoriteButton.onclick =
      function() {

        toggleFavorite(
          medicine
        );

      };

  }


  /*
   * EDIT
   */

  const editButton =
    row.querySelector(
      ".edit-button"
    );


  if (editButton) {

    editButton.onclick =
      function() {

        openEditMedicine(
          medicine
        );

      };

  }


  return row;

}


/* =====================================================
   TOGGLE FAVORITE
===================================================== */

function toggleFavorite(medicine) {

  const oldValue =
    isFavorite(
      medicine
    );


  const newValue =
    !oldValue;


  /*
   * Update UI immediately
   */

  medicine.favorite =
    newValue;


  updateFavoriteCount();

  renderMedicines();


  /*
   * Save to sheet
   */

  google.script.run

    .withSuccessHandler(
      function() {

        google.script.run

          .withSuccessHandler(
            function(data) {

              medicines =
                data || [];

              updateFavoriteCount();

              renderCategories();

              renderMedicines();

            }
          )

          .withFailureHandler(
            function(error) {

              medicine.favorite =
                oldValue;

              updateFavoriteCount();

              renderMedicines();

              showError(error);

            }
          )

          .getMedicines();

      }
    )

    .withFailureHandler(
      function(error) {

        medicine.favorite =
          oldValue;

        updateFavoriteCount();

        renderMedicines();

        showError(error);

      }
    )

    .toggleMedicineFavorite(
      medicine.name,
      newValue
    );

}


/* =====================================================
   ADD MEDICINE
===================================================== */

function openAddMedicine() {

  editingOriginalName = "";


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Add Medicine";


  document.getElementById(
    "medicineName"
  ).value = "";


  document.getElementById(
    "medicineOnlineLink"
  ).value = "";


  document.getElementById(
    "medicineGenericName"
  ).value = "";


  document.getElementById(
    "medicineNotes"
  ).value = "";


  document.getElementById(
    "medicineFavorite"
  ).checked = false;


  populateCategorySelect();


  const categorySelect =
    document.getElementById(
      "medicineCategory"
    );


  if (categorySelect) {

    categorySelect.value =
      selectedCategory === "ALL"
        ? ""
        : selectedCategory;

  }


  document.getElementById(
    "saveButton"
  ).textContent =
    "Save";


  /*
   * Hide delete for ADD
   */

  const deleteButton =
    document.getElementById(
      "deleteFromEditButton"
    );


  if (deleteButton) {

    deleteButton.classList.add(
      "hidden"
    );

  }


  document
    .getElementById(
      "medicineModal"
    )
    .classList.remove(
      "hidden"
    );

}


/* =====================================================
   EDIT MEDICINE
===================================================== */

function openEditMedicine(medicine) {

  editingOriginalName =
    medicine.name;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Edit Medicine";


  document.getElementById(
    "medicineName"
  ).value =
    medicine.name || "";


  populateCategorySelect();


  document.getElementById(
    "medicineCategory"
  ).value =
    medicine.category || "";


  document.getElementById(
    "medicineOnlineLink"
  ).value =
    medicine.onlineLink || "";


  document.getElementById(
    "medicineGenericName"
  ).value =
    medicine.genericName || "";


  document.getElementById(
    "medicineNotes"
  ).value =
    medicine.notes || "";


  document.getElementById(
    "medicineFavorite"
  ).checked =
    isFavorite(
      medicine
    );


  document.getElementById(
    "saveButton"
  ).textContent =
    "Save Changes";


  /*
   * Show delete inside edit
   */

  const deleteButton =
    document.getElementById(
      "deleteFromEditButton"
    );


  if (deleteButton) {

    deleteButton.classList.remove(
      "hidden"
    );

  }


  document
    .getElementById(
      "medicineModal"
    )
    .classList.remove(
      "hidden"
    );

}


/* =====================================================
   CATEGORY SELECT
===================================================== */

function populateCategorySelect() {

  const select =
    document.getElementById(
      "medicineCategory"
    );


  if (!select) {
    return;
  }


  select.innerHTML =
    '<option value="">Select category</option>';


  categories.forEach(
    function(category) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        category.name;


      option.textContent =
        (
          category.icon ||
          getCategoryIcon(
            category.name
          )
        ) +
        " " +
        category.name;


      select.appendChild(
        option
      );

    }
  );

}


/* =====================================================
   SAVE MEDICINE
===================================================== */

function saveMedicine() {

  const name =
    document.getElementById(
      "medicineName"
    )
    .value
    .trim();


  if (!name) {

    alert(
      "Medicine name is required."
    );

    return;

  }


  const medicine = {

    name:
      name,

    category:
      document.getElementById(
        "medicineCategory"
      ).value,

    onlineLink:
      document.getElementById(
        "medicineOnlineLink"
      ).value.trim(),

    genericName:
      document.getElementById(
        "medicineGenericName"
      ).value.trim(),

    notes:
      document.getElementById(
        "medicineNotes"
      ).value.trim(),

    favorite:
      document.getElementById(
        "medicineFavorite"
      ).checked

  };


  const button =
    document.getElementById(
      "saveButton"
    );


  button.disabled =
    true;

  button.textContent =
    "Saving...";


  const success =
    function(result) {

      button.disabled =
        false;


      if (
        result &&
        result.duplicate
      ) {

        button.textContent =
          editingOriginalName
            ? "Save Changes"
            : "Save";


        showDuplicate(
          result.message
        );


        return;

      }


      closeMedicineModal();

      loadEverything();

    };


  const failure =
    function(error) {

      button.disabled =
        false;


      button.textContent =
        editingOriginalName
          ? "Save Changes"
          : "Save";


      showError(error);

    };


  if (
    editingOriginalName
  ) {

    google.script.run

      .withSuccessHandler(
        success
      )

      .withFailureHandler(
        failure
      )

      .updateMedicine(
        medicine,
        editingOriginalName
      );

  }
  else {

    google.script.run

      .withSuccessHandler(
        success
      )

      .withFailureHandler(
        failure
      )

      .addMedicine(
        medicine
      );

  }

}


/* =====================================================
   CLOSE MEDICINE MODAL
===================================================== */

function closeMedicineModal() {

  document
    .getElementById(
      "medicineModal"
    )
    .classList.add(
      "hidden"
    );

}


/* =====================================================
   DELETE
===================================================== */

function openDeleteMedicine(name) {

  medicineBeingDeleted =
    name;


  document.getElementById(
    "deleteMedicineName"
  ).textContent =
    name;


  document.getElementById(
    "deletePasscode"
  ).value = "";


  document
    .getElementById(
      "deleteModal"
    )
    .classList.remove(
      "hidden"
    );

}


function closeDeleteModal() {

  document
    .getElementById(
      "deleteModal"
    )
    .classList.add(
      "hidden"
    );

}


function confirmDelete() {

  const passcode =
    document.getElementById(
      "deletePasscode"
    ).value;


  if (!passcode) {

    alert(
      "Please enter the passcode."
    );

    return;

  }


  google.script.run

    .withSuccessHandler(
      function() {

        closeDeleteModal();

        loadEverything();

      }
    )

    .withFailureHandler(
      showError
    )

    .deleteMedicine(
      medicineBeingDeleted,
      passcode
    );

}


/* =====================================================
   DELETE FROM EDIT WINDOW
===================================================== */

function deleteFromEdit() {

  if (!editingOriginalName) {

    return;

  }


  const medicineName =
    editingOriginalName;


  closeMedicineModal();


  openDeleteMedicine(
    medicineName
  );

}


/* =====================================================
   SETTINGS
===================================================== */

function openSettings() {

  renderSettingsCategories();


  document
    .getElementById(
      "settingsModal"
    )
    .classList.remove(
      "hidden"
    );

}


function closeSettings() {

  document
    .getElementById(
      "settingsModal"
    )
    .classList.add(
      "hidden"
    );

}


/* =====================================================
   SETTINGS CATEGORY LIST
===================================================== */

function renderSettingsCategories() {

  const container =
    document.getElementById(
      "settingsCategoryList"
    );


  if (!container) {
    return;
  }


  container.innerHTML = "";


  categories.forEach(
    function(category) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "settings-category-item";


      item.innerHTML =

        '<div class="category-setting-name">' +

          '<span class="setting-category-icon">' +

            escapeHtml(
              category.icon ||
              "💊"
            ) +

          '</span>' +

          '<span>' +

            escapeHtml(
              category.name
            ) +

          '</span>' +

        '</div>' +


        '<div class="category-setting-actions">' +

          '<button ' +
          'class="category-edit-button" ' +
          'title="Edit category">' +

            '✏️' +

          '</button>' +


          '<button ' +
          'class="remove-category" ' +
          'title="Delete category">' +

            '×' +

          '</button>' +

        '</div>';


      item
        .querySelector(
          ".category-edit-button"
        )
        .onclick =
          function() {

            editCategory(
              category
            );

          };


      item
        .querySelector(
          ".remove-category"
        )
        .onclick =
          function() {

            removeCategory(
              category.name
            );

          };


      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   ADD CATEGORY
===================================================== */

function addNewCategory() {

  const input =
    document.getElementById(
      "newCategory"
    );


  if (!input) {
    return;
  }


  const category =
    input.value.trim();


  if (!category) {

    alert(
      "Please enter a category."
    );

    return;

  }


  /*
   * Ask for icon here.
   * This also works if the current
   * Settings HTML does not yet have
   * a separate icon input.
   */

  const icon =
    prompt(
      "Enter category icon / emoji:",
      "💊"
    );


  if (icon === null) {
    return;
  }


  const finalIcon =
    icon.trim() ||
    "💊";


  google.script.run

    .withSuccessHandler(
      function(result) {

        if (
          result &&
          result.duplicate
        ) {

          showDuplicate(
            result.message
          );

          return;

        }


        input.value = "";


        loadEverything();

      }
    )

    .withFailureHandler(
      showError
    )

    .addCategory(
      category,
      finalIcon
    );

}


/* =====================================================
   EDIT CATEGORY
===================================================== */

function editCategory(category) {

  const newName =
    prompt(
      "Category name:",
      category.name
    );


  if (
    newName === null
  ) {

    return;

  }


  const trimmedName =
    newName.trim();


  if (!trimmedName) {

    alert(
      "Category name cannot be empty."
    );

    return;

  }


  const newIcon =
    prompt(
      "Category icon / emoji:",
      category.icon || "💊"
    );


  if (
    newIcon === null
  ) {

    return;

  }


  const trimmedIcon =
    newIcon.trim() ||
    "💊";


  google.script.run

    .withSuccessHandler(
      function(result) {

        if (
          result &&
          result.duplicate
        ) {

          showDuplicate(
            result.message
          );

          return;

        }


        if (
          String(
            selectedCategory
          )
            .toLowerCase() ===
          String(
            category.name
          )
            .toLowerCase()
        ) {

          selectedCategory =
            trimmedName;

        }


        loadEverything();

      }
    )

    .withFailureHandler(
      showError
    )

    .updateCategory(
      category.name,
      trimmedName,
      trimmedIcon
    );

}


/* =====================================================
   DELETE CATEGORY
===================================================== */

function removeCategory(category) {

  const used =
    medicines.some(
      function(medicine) {

        return (
          String(
            medicine.category || ""
          )
            .trim()
            .toLowerCase() ===
          String(category)
            .trim()
            .toLowerCase()
        );

      }
    );


  if (used) {

    alert(
      'Cannot delete "' +
      category +
      '" because medicines are using this category.'
    );

    return;

  }


  if (
    !confirm(
      'Delete category "' +
      category +
      '"?'
    )
  ) {

    return;

  }


  google.script.run

    .withSuccessHandler(
      function() {

        if (
          String(
            selectedCategory
          )
            .toLowerCase() ===
          String(
            category
          )
            .toLowerCase()
        ) {

          selectedCategory =
            "ALL";

        }


        loadEverything();

      }
    )

    .withFailureHandler(
      showError
    )

    .deleteCategory(
      category
    );

}


/* =====================================================
   DUPLICATE POPUP
===================================================== */

function showDuplicate(message) {

  const element =
    document.getElementById(
      "duplicateMessage"
    );


  if (element) {

    element.textContent =
      message ||
      "This item already exists.";

  }


  document
    .getElementById(
      "duplicateModal"
    )
    .classList.remove(
      "hidden"
    );

}


function closeDuplicateModal() {

  document
    .getElementById(
      "duplicateModal"
    )
    .classList.add(
      "hidden"
    );

}


/* =====================================================
   CATEGORY SCROLL
===================================================== */

function scrollCategories(direction) {

  const scroller =
    document.getElementById(
      "categoryScroller"
    );


  if (!scroller) {
    return;
  }


  scroller.scrollBy({

    left:
      direction * 300,

    behavior:
      "smooth"

  });

}


/* =====================================================
   ERROR
===================================================== */

function showError(error) {

  const message =
    error &&
    error.message
      ? error.message
      : String(error);


  alert(
    message
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(
    value == null
      ? ""
      : value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value) {

  return escapeHtml(
    value
  );

}


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Escape"
    ) {

      closeMedicineModal();

      closeDeleteModal();

      closeSettings();

      closeDuplicateModal();

    }

  }
);
