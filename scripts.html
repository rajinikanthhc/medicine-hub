<script>

/* =====================================================
   GLOBAL DATA
===================================================== */

let medicines = [];

let categories = [];

let selectedCategory = "ALL";

let searchText = "";

let favoritesOnly = false;

let editingOriginalName = "";

let medicineBeingDeleted = "";

let currentSort = "az";


/* =====================================================
   CATEGORY DATA
===================================================== */

const defaultCategoryIcons = {

  "cough": "😷",
  "fever": "🌡️",
  "cold": "🤧",
  "cough & cold": "😷",
  "pain": "💊",
  "headache": "🤕",
  "stomach": "🩺",
  "allergy": "🤧",
  "skin": "🧴",
  "eye": "👁️",
  "ear": "👂",
  "vitamins": "💊",
  "diabetes": "🩸",
  "blood pressure": "❤️",
  "heart": "❤️",
  "infection": "🦠",
  "children": "👶",
  "other": "💊"

};


function getCategoryIcon(category) {

  const found =
    categories.find(
      function(item) {

        return (
          String(
            item.name
          )
          .trim()
          .toLowerCase() ===
          String(
            category || ""
          )
          .trim()
          .toLowerCase()
        );

      }
    );


  if (
    found &&
    found.icon
  ) {

    return found.icon;

  }


  const key =
    String(
      category || ""
    )
    .trim()
    .toLowerCase();


  return (
    defaultCategoryIcons[key] ||
    "💊"
  );

}


/* =====================================================
   PAGE LOAD
===================================================== */

window.onload =
  function() {

    loadEverything();

  };


function loadEverything() {

  /*
   * Load medicines and categories
   * independently so one does not
   * block the other.
   */

  google.script.run

    .withSuccessHandler(
      function(data) {

        medicines =
          data || [];

        updateFavoriteCount();

        renderCategories();

        renderMedicines();

      }
    )

    .withFailureHandler(
      showError
    )

    .getMedicines();


  google.script.run

    .withSuccessHandler(
      function(data) {

        categories =
          data || [];

        renderCategories();

        populateCategorySelect();

        renderSettingsCategories();

        renderMedicines();

      }
    )

    .withFailureHandler(
      showError
    )

    .getCategories();

}


/* =====================================================
   CATEGORY CARDS
===================================================== */

function renderCategories() {

  const container =
    document.getElementById(
      "categoryScroller"
    );


  if (!container) {

    return;

  }


  container.innerHTML = "";


  /*
   * ALL
   */

  container.appendChild(

    createCategoryCard(
      "ALL",
      "💊",
      medicines.length,
      0
    )

  );


  /*
   * Categories
   */

  categories.forEach(
    function(category, index) {

      const count =
        medicines.filter(
          function(medicine) {

            return (
              String(
                medicine.category || ""
              )
              .trim()
              .toLowerCase() ===
              String(
                category.name
              )
              .trim()
              .toLowerCase()
            );

          }
        ).length;


      container.appendChild(

        createCategoryCard(

          category.name,

          category.icon ||
            "💊",

          count,

          index + 1

        )

      );

    }
  );

}


/* =====================================================
   CATEGORY CARD
===================================================== */

function createCategoryCard(
  category,
  icon,
  count,
  index
) {

  const card =
    document.createElement(
      "div"
    );


  card.className =
    "category-card category-color-" +
    (index % 8);


  if (
    selectedCategory ===
    category
  ) {

    card.classList.add(
      "active"
    );

  }


  card.onclick =
    function() {

      selectCategory(
        category
      );

    };


  card.innerHTML =

    '<div class="category-icon">' +
      escapeHtml(icon) +
    '</div>' +

    '<div class="category-name">' +
      escapeHtml(
        category === "ALL"
          ? "All Medicines"
          : category
      ) +
    '</div>' +

    '<div class="category-count">' +

      count +

      (
        count === 1
          ? " medicine"
          : " medicines"
      ) +

    '</div>';


  return card;

}


/* =====================================================
   SELECT CATEGORY
===================================================== */

function selectCategory(
  category
) {

  selectedCategory =
    category;

  favoritesOnly =
    false;

  renderCategories();

  renderMedicines();

}


/* =====================================================
   FAVORITES
===================================================== */

function showFavorites() {

  favoritesOnly =
    !favoritesOnly;


  if (
    favoritesOnly
  ) {

    selectedCategory =
      "ALL";

  }


  renderCategories();

  renderMedicines();

}


/* =====================================================
   FAVORITE COUNT
===================================================== */

function updateFavoriteCount() {

  const count =
    medicines.filter(
      function(medicine) {

        return (
          medicine.favorite ===
          true
        );

      }
    ).length;


  const element =
    document.getElementById(
      "favoriteCount"
    );


  if (element) {

    element.textContent =
      count;

  }

}


/* =====================================================
   SEARCH
===================================================== */

function handleSearch() {

  searchText =
    document.getElementById(
      "searchInput"
    )
    .value
    .trim()
    .toLowerCase();


  const clearButton =
    document.getElementById(
      "clearSearch"
    );


  if (searchText) {

    clearButton.classList.remove(
      "hidden"
    );

  }
  else {

    clearButton.classList.add(
      "hidden"
    );

  }


  renderMedicines();

}


function clearSearch() {

  document.getElementById(
    "searchInput"
  ).value = "";


  searchText = "";


  document
    .getElementById(
      "clearSearch"
    )
    .classList.add(
      "hidden"
    );


  renderMedicines();

}


/* =====================================================
   SORT
===================================================== */

function changeSort() {

  currentSort =
    document.getElementById(
      "sortSelect"
    ).value;


  renderMedicines();

}


/* =====================================================
   FILTER
===================================================== */

function getFilteredMedicines() {

  let list =
    medicines.slice();


  /*
   * Category
   */

  if (
    selectedCategory !==
    "ALL"
  ) {

    list =
      list.filter(
        function(medicine) {

          return (
            String(
              medicine.category || ""
            )
            .trim()
            .toLowerCase() ===
            String(
              selectedCategory
            )
            .trim()
            .toLowerCase()
          );

        }
      );

  }


  /*
   * Favorites
   */

  if (
    favoritesOnly
  ) {

    list =
      list.filter(
        function(medicine) {

          return (
            medicine.favorite ===
            true
          );

        }
      );

  }


  /*
   * Search
   */

  if (
    searchText
  ) {

    list =
      list.filter(
        function(medicine) {

          const combined = [

            medicine.name,

            medicine.category,

            medicine.onlineLink,

            medicine.genericName

          ]
          .join(" ")
          .toLowerCase();


          return combined.includes(
            searchText
          );

        }
      );

  }


  /*
   * ONLY TWO SORTS:
   *
   * A → Z
   * Z → A
   */

  list.sort(
    function(a, b) {

      const nameA =
        String(
          a.name || ""
        ).toLowerCase();


      const nameB =
        String(
          b.name || ""
        ).toLowerCase();


      const result =
        nameA.localeCompare(
          nameB
        );


      if (
        currentSort ===
        "za"
      ) {

        return -result;

      }


      return result;

    }
  );


  /*
   * IMPORTANT:
   *
   * Favorites are always
   * shown above non-favorites,
   * regardless of A-Z / Z-A.
   */

  list.sort(
    function(a, b) {

      if (
        a.favorite !==
        b.favorite
      ) {

        return a.favorite
          ? -1
          : 1;

      }


      const nameA =
        String(
          a.name || ""
        ).toLowerCase();


      const nameB =
        String(
          b.name || ""
        ).toLowerCase();


      const result =
        nameA.localeCompare(
          nameB
        );


      return currentSort ===
        "za"
        ? -result
        : result;

    }
  );


  return list;

}


/* =====================================================
   RENDER MEDICINES
===================================================== */

function renderMedicines() {

  const tbody =
    document.getElementById(
      "medicineTableBody"
    );


  if (!tbody) {

    return;

  }


  const list =
    getFilteredMedicines();


  updatePanelTitle(
    list
  );


  tbody.innerHTML = "";


  if (
    list.length === 0
  ) {

    const row =
      document.createElement(
        "tr"
      );


    row.innerHTML =

      '<td colspan="6" ' +
      'style="text-align:center;' +
      'padding:45px;color:#718096;">' +

      (
        favoritesOnly
          ? "No favorite medicines yet."
          : "No medicines in this category yet."
      ) +

      '</td>';


    tbody.appendChild(
      row
    );


    return;

  }


  list.forEach(
    function(medicine) {

      tbody.appendChild(
        createMedicineRow(
          medicine
        )
      );

    }
  );

}


/* =====================================================
   PANEL TITLE
===================================================== */

function updatePanelTitle(
  list
) {

  const title =
    document.getElementById(
      "selectedCategoryTitle"
    );


  const count =
    document.getElementById(
      "selectedCategoryCount"
    );


  const icon =
    document.getElementById(
      "selectedCategoryIcon"
    );


  if (
    favoritesOnly
  ) {

    title.textContent =
      "Favorites";

    icon.textContent =
      "⭐";

  }
  else if (
    selectedCategory ===
    "ALL"
  ) {

    title.textContent =
      "All Medicines";

    icon.textContent =
      "💊";

  }
  else {

    title.textContent =
      selectedCategory;

    icon.textContent =
      getCategoryIcon(
        selectedCategory
      );

  }


  count.textContent =
    list.length +
    (
      list.length === 1
        ? " medicine"
        : " medicines"
    );

}


/* =====================================================
   MEDICINE ROW
===================================================== */

function createMedicineRow(
  medicine
) {

  const row =
    document.createElement(
      "tr"
    );


  const link =
    String(
      medicine.onlineLink || ""
    ).trim();


  let linkHtml;


  if (link) {

    linkHtml =

      '<a class="online-link" ' +

      'href="' +
      escapeAttribute(
        link
      ) +
      '" ' +

      'target="_blank" ' +

      'rel="noopener noreferrer">' +

      'Open Link' +

      '</a>';

  }
  else {

    linkHtml =
      '<span class="no-link">—</span>';

  }


  row.innerHTML =

    '<td class="favorite-column">' +

      '<button ' +

      'class="favorite-star ' +

      (
        medicine.favorite
          ? "on"
          : "off"
      ) +

      '" ' +

      'title="' +

      (
        medicine.favorite
          ? "Remove favorite"
          : "Add favorite"
      ) +

      '">' +

      (
        medicine.favorite
          ? "⭐"
          : "☆"
      ) +

      '</button>' +

    '</td>' +


    '<td>' +

      '<span class="medicine-name">' +

        escapeHtml(
          medicine.name
        ) +

      '</span>' +

    '</td>' +


    '<td>' +

      escapeHtml(
        medicine.category ||
        "—"
      ) +

    '</td>' +


    '<td>' +

      linkHtml +

    '</td>' +


    '<td>' +

      escapeHtml(
        medicine.genericName ||
        "—"
      ) +

    '</td>' +


    '<td class="edit-column">' +

      '<button ' +

      'class="edit-button" ' +

      'title="Edit">' +

      '✏️' +

      '</button>' +


      '<button ' +

      'class="edit-button delete-row-button" ' +

      'title="Delete">' +

      '🗑️' +

      '</button>' +

    '</td>';


  /*
   * FAVORITE BUTTON
   */

  const favoriteButton =
    row.querySelector(
      ".favorite-star"
    );


  favoriteButton.onclick =
    function() {

      toggleFavorite(
        medicine
      );

    };


  /*
   * EDIT
   */

  row
    .querySelector(
      ".edit-button"
    )
    .onclick =
      function() {

        openEditMedicine(
          medicine
        );

      };


  /*
   * DELETE
   */

  row
    .querySelector(
      ".delete-row-button"
    )
    .onclick =
      function() {

        openDeleteMedicine(
          medicine.name
        );

      };


  return row;

}


/* =====================================================
   TOGGLE FAVORITE
===================================================== */

function toggleFavorite(
  medicine
) {

  const oldValue =
    medicine.favorite === true;


  const newValue =
    !oldValue;


  /*
   * Immediately update UI.
   */

  medicine.favorite =
    newValue;


  updateFavoriteCount();

  renderMedicines();


  /*
   * Save to Google Sheet.
   */

  google.script.run

    .withSuccessHandler(
      function(result) {

        /*
         * Reload from sheet so the
         * browser and sheet stay
         * completely synchronized.
         */

        google.script.run

          .withSuccessHandler(
            function(data) {

              medicines =
                data || [];

              updateFavoriteCount();

              renderCategories();

              renderMedicines();

            }
          )

          .withFailureHandler(
            function(error) {

              medicine.favorite =
                oldValue;

              updateFavoriteCount();

              renderMedicines();

              showError(error);

            }
          )

          .getMedicines();

      }
    )

    .withFailureHandler(
      function(error) {

        medicine.favorite =
          oldValue;

        updateFavoriteCount();

        renderMedicines();

        showError(error);

      }
    )

    .toggleMedicineFavorite(
      medicine.name,
      newValue
    );

}


/* =====================================================
   ADD MEDICINE
===================================================== */

function openAddMedicine() {

  editingOriginalName =
    "";


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Add Medicine";


  document.getElementById(
    "medicineName"
  ).value = "";


  document.getElementById(
    "medicineOnlineLink"
  ).value = "";


  document.getElementById(
    "medicineGenericName"
  ).value = "";


  document.getElementById(
    "medicineFavorite"
  ).checked = false;


  populateCategorySelect();


  document.getElementById(
    "medicineCategory"
  ).value =
    selectedCategory === "ALL"
      ? ""
      : selectedCategory;


  document.getElementById(
    "saveButton"
  ).textContent =
    "Save";


  document
    .getElementById(
      "medicineModal"
    )
    .classList.remove(
      "hidden"
    );


  setTimeout(
    function() {

      document
        .getElementById(
          "medicineName"
        )
        .focus();

    },
    100
  );

}


/* =====================================================
   EDIT MEDICINE
===================================================== */

function openEditMedicine(
  medicine
) {

  editingOriginalName =
    medicine.name;


  document.getElementById(
    "modalTitle"
  ).textContent =
    "Edit Medicine";


  document.getElementById(
    "medicineName"
  ).value =
    medicine.name;


  populateCategorySelect();


  document.getElementById(
    "medicineCategory"
  ).value =
    medicine.category || "";


  document.getElementById(
    "medicineOnlineLink"
  ).value =
    medicine.onlineLink || "";


  document.getElementById(
    "medicineGenericName"
  ).value =
    medicine.genericName || "";


  document.getElementById(
    "medicineFavorite"
  ).checked =
    medicine.favorite === true;


  document.getElementById(
    "saveButton"
  ).textContent =
    "Save Changes";


  document
    .getElementById(
      "medicineModal"
    )
    .classList.remove(
      "hidden"
    );

}


/* =====================================================
   CATEGORY SELECT
===================================================== */

function populateCategorySelect() {

  const select =
    document.getElementById(
      "medicineCategory"
    );


  if (!select) {

    return;

  }


  select.innerHTML =
    '<option value="">Select category</option>';


  categories.forEach(
    function(category) {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        category.name;


      option.textContent =
        (
          category.icon ||
          "💊"
        ) +
        " " +
        category.name;


      select.appendChild(
        option
      );

    }
  );

}


/* =====================================================
   SAVE MEDICINE
===================================================== */

function saveMedicine() {

  const name =
    document.getElementById(
      "medicineName"
    )
    .value
    .trim();


  if (!name) {

    alert(
      "Medicine name is required."
    );

    return;

  }


  const medicine = {

    name:

      name,

    category:

      document.getElementById(
        "medicineCategory"
      ).value,

    onlineLink:

      document.getElementById(
        "medicineOnlineLink"
      ).value.trim(),

    genericName:

      document.getElementById(
        "medicineGenericName"
      ).value.trim(),

    favorite:

      document.getElementById(
        "medicineFavorite"
      ).checked

  };


  const button =
    document.getElementById(
      "saveButton"
    );


  button.disabled =
    true;

  button.textContent =
    "Saving...";


  const success =
    function(result) {

      button.disabled =
        false;


      if (
        result &&
        result.duplicate
      ) {

        button.textContent =
          editingOriginalName
            ? "Save Changes"
            : "Save";


        showDuplicate(
          result.message
        );


        return;

      }


      closeMedicineModal();

      loadEverything();

    };


  const failure =
    function(error) {

      button.disabled =
        false;


      button.textContent =
        editingOriginalName
          ? "Save Changes"
          : "Save";


      showError(error);

    };


  if (
    editingOriginalName
  ) {

    google.script.run

      .withSuccessHandler(
        success
      )

      .withFailureHandler(
        failure
      )

      .updateMedicine(
        medicine,
        editingOriginalName
      );

  }
  else {

    google.script.run

      .withSuccessHandler(
        success
      )

      .withFailureHandler(
        failure
      )

      .addMedicine(
        medicine
      );

  }

}


/* =====================================================
   CLOSE MEDICINE MODAL
===================================================== */

function closeMedicineModal() {

  document
    .getElementById(
      "medicineModal"
    )
    .classList.add(
      "hidden"
    );

}


/* =====================================================
   DELETE
===================================================== */

function openDeleteMedicine(
  name
) {

  medicineBeingDeleted =
    name;


  document.getElementById(
    "deleteMedicineName"
  ).textContent =
    name;


  document.getElementById(
    "deletePasscode"
  ).value = "";


  document
    .getElementById(
      "deleteModal"
    )
    .classList.remove(
      "hidden"
    );

}


function closeDeleteModal() {

  document
    .getElementById(
      "deleteModal"
    )
    .classList.add(
      "hidden"
    );

}


function confirmDelete() {

  const passcode =
    document.getElementById(
      "deletePasscode"
    )
    .value;


  if (!passcode) {

    alert(
      "Please enter the passcode."
    );

    return;

  }


  google.script.run

    .withSuccessHandler(
      function() {

        closeDeleteModal();

        loadEverything();

      }
    )

    .withFailureHandler(
      showError
    )

    .deleteMedicine(
      medicineBeingDeleted,
      passcode
    );

}


/* =====================================================
   SETTINGS
===================================================== */

function openSettings() {

  renderSettingsCategories();


  document
    .getElementById(
      "settingsModal"
    )
    .classList.remove(
      "hidden"
    );

}


function closeSettings() {

  document
    .getElementById(
      "settingsModal"
    )
    .classList.add(
      "hidden"
    );

}


/* =====================================================
   SETTINGS CATEGORY LIST
===================================================== */

function renderSettingsCategories() {

  const container =
    document.getElementById(
      "settingsCategoryList"
    );


  if (!container) {

    return;

  }


  container.innerHTML = "";


  categories.forEach(
    function(category) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "settings-category-item";


      item.innerHTML =

        '<div class="category-setting-name">' +

          '<span class="setting-category-icon">' +

            escapeHtml(
              category.icon ||
              "💊"
            ) +

          '</span>' +

          '<span>' +

            escapeHtml(
              category.name
            ) +

          '</span>' +

        '</div>' +


        '<div class="category-setting-actions">' +

          '<button ' +
          'class="category-edit-button" ' +
          'title="Edit category">' +

            '✏️' +

          '</button>' +


          '<button ' +
          'class="remove-category" ' +
          'title="Delete category">' +

            '×' +

          '</button>' +

        '</div>';


      /*
       * EDIT
       */

      item
        .querySelector(
          ".category-edit-button"
        )
        .onclick =
          function() {

            editCategory(
              category
            );

          };


      /*
       * DELETE
       */

      item
        .querySelector(
          ".remove-category"
        )
        .onclick =
          function() {

            removeCategory(
              category.name
            );

          };


      container.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   ADD CATEGORY
===================================================== */

function addNewCategory() {

  const input =
    document.getElementById(
      "newCategory"
    );


  const iconInput =
    document.getElementById(
      "newCategoryIcon"
    );


  const category =
    input.value.trim();


  const icon =
    iconInput.value.trim();


  if (!category) {

    alert(
      "Please enter a category."
    );

    return;

  }


  google.script.run

    .withSuccessHandler(
      function(result) {

        if (
          result &&
          result.duplicate
        ) {

          showDuplicate(
            result.message
          );

          return;

        }


        input.value = "";

        iconInput.value = "";


        loadEverything();

      }
    )

    .withFailureHandler(
      showError
    )

    .addCategory(
      category,
      icon
    );

}


/* =====================================================
   EDIT CATEGORY
===================================================== */

function editCategory(
  category
) {

  const newName =
    prompt(
      "Category name:",
      category.name
    );


  if (
    newName === null
  ) {

    return;

  }


  const trimmedName =
    newName.trim();


  if (!trimmedName) {

    alert(
      "Category name cannot be empty."
    );

    return;

  }


  const newIcon =
    prompt(
      "Category icon / emoji:",
      category.icon || "💊"
    );


  if (
    newIcon === null
  ) {

    return;

  }


  const trimmedIcon =
    newIcon.trim() ||
    "💊";


  google.script.run

    .withSuccessHandler(
      function(result) {

        if (
          result &&
          result.duplicate
        ) {

          showDuplicate(
            result.message
          );

          return;

        }


        /*
         * Keep selected category
         * synchronized if renamed.
         */

        if (
          selectedCategory
            .toLowerCase() ===
          category.name
            .toLowerCase()
        ) {

          selectedCategory =
            trimmedName;

        }


        loadEverything();

      }
    )

    .withFailureHandler(
      showError
    )

    .updateCategory(
      category.name,
      trimmedName,
      trimmedIcon
    );

}


/* =====================================================
   DELETE CATEGORY
===================================================== */

function removeCategory(
  category
) {

  const used =
    medicines.some(
      function(medicine) {

        return (
          String(
            medicine.category || ""
          )
          .trim()
          .toLowerCase() ===
          String(category)
            .trim()
            .toLowerCase()
        );

      }
    );


  if (used) {

    alert(
      'Cannot delete "' +
      category +
      '" because medicines are using this category.'
    );

    return;

  }


  if (
    !confirm(
      'Delete category "' +
      category +
      '"?'
    )
  ) {

    return;

  }


  google.script.run

    .withSuccessHandler(
      function() {

        if (
          selectedCategory
            .toLowerCase() ===
          category.toLowerCase()
        ) {

          selectedCategory =
            "ALL";

        }


        loadEverything();

      }
    )

    .withFailureHandler(
      showError
    )

    .deleteCategory(
      category
    );

}


/* =====================================================
   DUPLICATE POPUP
===================================================== */

function showDuplicate(
  message
) {

  document.getElementById(
    "duplicateMessage"
  ).textContent =
    message ||
    "This item already exists.";


  document
    .getElementById(
      "duplicateModal"
    )
    .classList.remove(
      "hidden"
    );

}


function closeDuplicateModal() {

  document
    .getElementById(
      "duplicateModal"
    )
    .classList.add(
      "hidden"
    );

}


/* =====================================================
   CATEGORY SCROLL
===================================================== */

function scrollCategories(
  direction
) {

  const scroller =
    document.getElementById(
      "categoryScroller"
    );


  scroller.scrollBy({

    left:
      direction * 300,

    behavior:
      "smooth"

  });

}


/* =====================================================
   ERROR
===================================================== */

function showError(
  error
) {

  const message =
    error &&
    error.message
      ? error.message
      : String(error);


  alert(
    message
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  value
) {

  return String(
    value == null
      ? ""
      : value
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key ===
      "Escape"
    ) {

      closeMedicineModal();

      closeDeleteModal();

      closeSettings();

      closeDuplicateModal();

    }

  }
);

</script>
